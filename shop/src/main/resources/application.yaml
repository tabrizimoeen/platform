spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/platform
    username: postgres
    password: secret
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: shops
  flyway:
    enabled: true
    create-schemas: true
    schemas: shops
    default-schema: shops
    baseline-on-migrate: true
    baseline-version: 0

  application:
    name: shop
jwt:
  secret-key: my-super-secret-key-my-super-secret-key
  expiration: 600000
file:
  upload-dir: uploads
zarinpal:
  merchant-id: YOUR_MERCHANT_ID
  sandbox: true
  request-url: https://sandbox.zarinpal.com/pg/v4/payment/request.json
  startpay-url: https://sandbox.zarinpal.com/pg/StartPay/
  verify-url: https://sandbox.zarinpal.com/pg/v4/payment/verify.json