services:
  db:
    image: postgres:15
    container_name: platform-db
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  repair:
    build: ./repair
    container_name: platform-repair
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/platform
    ports:
      - "8081:8081"

  shop:
    build: ./shop
    container_name: platform-shop
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/platform
    ports:
      - "8080:8080"

volumes:
  db_data:
